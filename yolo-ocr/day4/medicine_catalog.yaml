version: 1
source: "类别(2).pdf + 已有药盒 OCR/人工复核结果"

categories:
  - id: 0
    name: 感冒药
    efficacy: 缓解感冒引起的发热、头痛、鼻塞、流涕、咽痛等症状，具体以药品说明书为准。
    guidance: 感冒总称；包装以感冒、鼻塞、流涕等为主。
  - id: 1
    name: 止咳化痰
    efficacy: 镇咳、祛痰或缓解喘息，适用于咳嗽、咳痰等症状，具体以药品说明书为准。
    guidance: 与感冒药边界不清时，以咳嗽、咳痰为主则归本类。
  - id: 2
    name: 消炎药
    efficacy: 用于对应敏感病原体引起的感染，不同抗菌、抗病毒或抗真菌药的适应症不同，须遵医嘱使用。
    guidance: 抗感染、抗菌类，如阿莫西林、头孢、罗红霉素。
  - id: 3
    name: 止痛药
    efficacy: 缓解轻至中度疼痛或炎症相关疼痛，具体适应症以药品说明书为准。
    guidance: 以止痛为主；对乙酰氨基酚等未强调退热时归本类。
  - id: 4
    name: 退烧药
    efficacy: 降低发热体温并缓解发热伴随的不适，具体用法及适用人群以药品说明书为准。
    guidance: 包装明确强调退热、退烧时归本类。
  - id: 5
    name: 肠胃药
    efficacy: 缓解胃痛、胃酸、消化不良、腹泻等胃肠道症状，具体以药品说明书为准。
    guidance: 胃痛、胃酸、消化不良、止泻等肠胃用药。
  - id: 6
    name: 泻药通便
    efficacy: 软化粪便、促进排便或缓解便秘，具体以药品说明书为准。
    guidance: 开塞露、乳果糖等通便用药。
  - id: 7
    name: 维生素
    efficacy: 补充相应维生素、矿物质或微量元素，用于预防和改善相关营养缺乏。
    guidance: 维生素、钙、锌等营养补充制剂。
  - id: 8
    name: 抗过敏药
    efficacy: 缓解过敏性鼻炎、荨麻疹或皮肤过敏引起的喷嚏、流涕、瘙痒等症状。
    guidance: 氯雷他定、西替利嗪等抗过敏用药。
  - id: 9
    name: 外用药
    efficacy: 用于局部皮肤、黏膜或眼部症状，具体作用及使用部位以药品说明书为准。
    guidance: 皮肤药膏、消毒液、眼药水等外用制剂。
  - id: 10
    name: 创可贴绷带
    efficacy: 覆盖、保护或固定浅表创口，辅助止血并减少外界污染。
    guidance: 创可贴、纱布、绷带和敷料。
  - id: 11
    name: 慢性病药
    efficacy: 用于糖尿病、甲状腺疾病等慢性病的长期控制，必须依据医嘱和具体说明书使用。
    guidance: 降糖、降脂等长期用药；明确心血管相关时优先归心血管药。
  - id: 12
    name: 心血管药
    efficacy: 用于高血压、冠心病、心绞痛或脑血管循环相关疾病，必须遵医嘱使用。
    guidance: 明确用于高血压、冠心病、心绞痛等心脑血管疾病。
  - id: 13
    name: 中成药
    efficacy: 不同品种可具有清热解毒、理气和中、活血化瘀或补益等作用，具体以该药说明书为准。
    guidance: 明确为中成药且不能优先归入其他功效类时使用。
  - id: 14
    name: 妇科用药
    efficacy: 用于月经不调、痛经、阴道炎或其他妇科相关症状，具体以药品说明书为准。
    guidance: 妇科相关盒装药。
  - id: 15
    name: 肛肠用药
    efficacy: 缓解痔疮引起的肿痛、出血、瘙痒等肛肠症状，具体以药品说明书为准。
    guidance: 痔疮等肛肠疾病用药；仅给药途径为栓剂不代表本类。
  - id: 16
    name: 保健品
    efficacy: 用于相应营养补充或保健功能，不用于替代药物治疗。
    guidance: 非治疗为主的保健食品。
  - id: 17
    name: 其它
    efficacy: 数据库暂无该品种的明确功效信息，请查阅包装说明书或咨询医生、药师。
    guidance: 无法归入前述类别或尚未收录的特殊药品。

